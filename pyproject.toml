[project]
name = "langchain-azure"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10.0"
dependencies = []

[tool.uv]
package = false
exclude-newer = "7 days"
constraint-dependencies = [
  "urllib3>=2.6.3",
  "cryptography>=46.0.7",
  "aiohttp>=3.13.4",
  "langgraph-checkpoint>=4.0.0",
  "nbconvert>=7.17.0",
  "pyjwt>=2.12.0",
]

[tool.uv.workspace]
members = ["libs/*"]
exclude = ["samples/**"]